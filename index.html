<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이정현 기획 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: 상단 칩만. 칩을 누르면 그 프로젝트 하나만 보인다. 프로젝트 = 한 줄 성과 + 숫자 3개 + 5단계(문제 정의 → 가설 → 설계 → 론칭 → 임팩트) 세로 줄 + 산출물. */
:root{
  --bg:#F3F4F6; --sheet:#FFFFFF; --ink:#111827; --muted:#5B6474; --line:#D7DBE2; --soft:#E9ECF1;
  --accent:#2448E6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FD; --good:#0F7A49; --good-soft:#E0F3E9; --data:#7A4FD6; --data-soft:#EEE7FB; --co:#B4550A; --co-soft:#FBEBDD;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1117;--sheet:#171B23;--ink:#E8ECF2;--muted:#9AA4B5;--line:#2C3441;--soft:#20262F;--accent:#8198FF;--accent-ink:#0E1117;--accent-soft:#1D2646;--good:#4CC38A;--good-soft:#13291F;--data:#B79BFF;--data-soft:#2A2140;--co:#F0A060;--co-soft:#3A2614;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1117;--sheet:#171B23;--ink:#E8ECF2;--muted:#9AA4B5;--line:#2C3441;--soft:#20262F;--accent:#8198FF;--accent-ink:#0E1117;--accent-soft:#1D2646;--good:#4CC38A;--good-soft:#13291F;--data:#B79BFF;--data-soft:#2A2140;--co:#F0A060;--co-soft:#3A2614;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px}
.name{font-weight:700;font-size:15px;white-space:nowrap}
.name small{display:block;font:500 11px var(--mono);color:var(--muted);line-height:1.2}
@media (max-width:640px){.name small{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.chip.alt{border-style:dashed}

main{padding-block:28px 64px}
.head{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:26px 28px}
.meta{font:500 12.5px var(--mono);color:var(--muted)}
.head h1{font-size:clamp(22px,3vw,30px);line-height:1.35;margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--bg)}
.links a:hover{border-color:var(--ink)}
.links a::after{content:"↗";color:var(--muted);font-size:12px}
.result{margin-top:16px;background:var(--good-soft);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.65}
.result b{color:var(--good)}
.result small{display:block;font:600 11.5px var(--mono);color:var(--good);letter-spacing:.06em;margin-bottom:2px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.nums div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.nums b{display:block;font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.nums span{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px}
@media (max-width:640px){.head{padding:20px 18px}.nums{grid-template-columns:1fr}}

.steps{margin-top:22px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative;padding-bottom:22px}
.step::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.no{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 15px var(--mono);position:relative;z-index:1}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card .lab{font:600 12px var(--mono);color:var(--accent);letter-spacing:.06em}
.card h2{font-size:18px;line-height:1.45;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px;display:grid;gap:5px}
.card li{font-size:14.5px;line-height:1.65}
.card li b{font-weight:600}
.tag{display:inline-block;font:600 11px var(--mono);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.d{background:var(--data-soft);color:var(--data)}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.tag.co{background:var(--co-soft);color:var(--co)}
.role{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.role b{color:var(--ink);font-weight:600}
table.t{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:top;line-height:1.55}
table.t td:first-child{font-weight:600}
.ts{overflow-x:auto;-webkit-overflow-scrolling:touch}.ts table{min-width:560px}
table.jd{margin-top:14px;border:1px solid var(--line);border-radius:8px;border-collapse:separate;border-spacing:0;overflow:hidden}
table.jd td{font-weight:500;font-size:13.5px;border-bottom:0;border-right:1px solid var(--soft);padding:8px 10px;width:25%}
table.jd td:last-child{border-right:0}
table.jd td:first-child{font-weight:500}
table.jd small{display:block;font:600 11px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
@media (max-width:640px){table.jd,table.jd tbody,table.jd tr{display:block}table.jd td{display:block;width:100%;border-right:0;border-bottom:1px solid var(--soft)}table.jd td:last-child{border-bottom:0}}
.note{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.6}


.gal{margin-top:8px}
.gal h3{font-size:15px;margin:6px 0 10px}
.gal .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.gal .g{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gal button{display:block;text-align:left;border:0;background:transparent;padding:0;cursor:zoom-in;min-width:0;width:100%}
.gal .im{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;aspect-ratio:4/3;max-width:100%}
.gal .im img{width:100%;height:100%;object-fit:cover;object-position:top}
.gal p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}

.lb{position:fixed;inset:0;z-index:50;background:#0B0D13;display:grid;grid-template-rows:auto minmax(0,1fr);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));color:#fff}
.lb-top .c{font:500 12px var(--mono);opacity:.8}
.lb-top p{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lb-top button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.lb-st{overflow:auto;display:grid;place-items:center;padding:0 16px 16px}
.lb-st img{max-width:100%;max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px);width:auto;height:auto;border-radius:6px;background:#fff}
.lb-st.actual{place-items:start center}
.lb-st.actual img{max-width:none;max-height:none}
.lb .arr{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(18,22,32,.7);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.lb .arr.p{left:calc(12px + env(safe-area-inset-left,0px))}.lb .arr.n{right:calc(12px + env(safe-area-inset-right,0px))}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="name">이정현<small>서비스 기획 · 콰라소프트 PM 3년 → 시그니처그룹 → 우주강아지 → 오션블루(현)</small></span>
  <nav class="chips" id="chips" aria-label="프로젝트"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="원본 크게 보기">
  <div class="lb-top"><span class="c" id="lb-c"></span><p id="lb-cap"></p><button type="button" id="lb-fit">원본 크기</button><button type="button" id="lb-x">닫기</button></div>
  <div class="lb-st" id="lb-st"><img id="lb-img" alt=""></div>
  <button class="arr p" type="button" id="lb-p" aria-label="이전">‹</button><button class="arr n" type="button" id="lb-n" aria-label="다음">›</button>
</div>

<script>
(function(){
var D='<span class="tag d">DATA</span>', A='<span class="tag ai">AI</span>', C='<span class="tag co">협업</span>';
var P=[
{id:"today",chip:"투데이 개편",

 res:"LGU+ 이용자의 82%가 복주머니만 받고 떠나 운세까지 가는 사람은 1%였고, AI 관상은 결과를 본 사람의 14.7%만 공유했습니다. 홈에는 '받은 뒤 갈 곳'을, 관상에는 '자랑하고 싶은 결과'를 만들어 <b>운세 전환 1% → 10%, 공유 14.7% → 30%</b>를 목표로 잡고 측정까지 설계했습니다. (오픈 후 4주 판정)",
 nums:[["82%","LGU+ 유입 중 복주머니만 받고 떠난 비율"],["1.0%","복주머니 → 오늘의 운세 · 목표 10%"],["14.7%","관상 결과 → 공유 · 목표 30%"]],
 steps:[
  {h:"트래픽은 들어오는데, 그다음이 없다",li:[
    D+"홈: LGU+ 복주머니 결과 → 투데이 홈 7.8% → 오늘의 운세 1.0%. 홈 평균 참여 시간 2초, 세션의 절반 가까이가 푸시 유입 (절대 수치는 통신사 제휴 데이터라 비공개)",
    D+"관상(오픈 5일): 홈 → 분석 시작 29% → 결과 → 공유 14.7%. 공유로 들어온 친구는 측정할 방법이 없었음",
    D+"두 통신사의 수집 기준이 달라 먼저 맞춤 — KT는 PASS 앱 카드 자동 로드 트래픽(전체의 97%)을 제외, LGU+는 KT 중복분 제외",

   r:"GA4 퍼널 분석 · 문제 정의 (데이터는 직접 만든 데이터마트에서 추출)"},
  {h:"받은 뒤 갈 곳을 만들고, 자랑하고 싶은 결과를 준다",li:[
    "홈 H1. 복주머니를 홈 최상단에 합치고 바로 아래 '오늘의 운세 점수'를 보여 주면 전환이 1% → 10% (목표치는 하위 화면 진입률 상한을 기준으로 산정)",
    "관상 H1. 결과를 '누구나 아는 조선 인물 16종'으로 바꾸고, 내 얼굴이 인물로 바뀌는 카드를 공유 이미지로 쓰면 공유가 14.7% → 30%",
    D+"가드 지표: 복주머니 참여 5% 이상 감소 시 원복 · 관상 분석 실패율 · 유료 전환율"],
   r:"가설 · KPI · 가드 지표 설계"},
  {h:"핵심 스펙 — 홈 3줄 · 관상 3줄",li:[
    "홈: ① 복주머니를 홈 최상단 영역에 통합 ② 오늘의 운세 점수(총평 + 운별 4칸) ③ 오늘의 추천(콘텐츠 → 상세 → 체험 4칸)",
    "관상: ① 결과 이름만 조선 인물 16종으로 교체(판정 로직 유지) ② 디졸브 관상 카드 = 공유 이미지 ③ 친구가 내 링크로 보면 채워지는 도감",

   r:"화면설계서 v2.0 · 콘셉트 비교 5안 · 화면 6종"},
  {h:"측정을 먼저 반영하고, LGU+ → KT 순서로 오픈",li:[

    C+"통신사의 우려(복주머니 참여 하락)는 가드 지표로 합의, 개발 범위는 '하위 화면 유지'로 확정",
    C+"관상은 일러스트 제작 방식 · 계급 표현 검수 · 공유 랜딩(utm) 개발을 결정 요청 3건으로 분리해 올림"],
   r:"일정 · 통신사 · 개발 조율"},
  {h:"오픈 후 4주 판정 — 지금은 '판정할 수 있는 상태'를 만들었다",li:[
    D+"KPI 7개(홈) · KR 4개(관상)와 기준선, GA 이벤트 5종(공유 전송 · 랜딩 진입 · 카드 노출 · 도감 진입 · 도감 채움) 설계 완료",
    "한계: 관상은 표본이 작고 푸시 유입 편향이 커서, 수치는 방향 확인용으로 명시했습니다.",
    "배운 것: 관상 v1.0 출시 때 공유 · 유입 이벤트가 없어 가장 중요한 질문에 데이터가 없었습니다. 이후 모든 신규 기능은 공유 · 유입 이벤트를 출시 조건에 넣습니다."],
   judge:[["기준선","운세 전환 1.0% · 공유 14.7%"],["목표","10% · 30%"],["판정일","오픈 후 4주 (통신사 검수 후 오픈)"],["결과","업데이트 예정"]],
   r:"측정 설계 · 회고"}],
 gal:[["hm2c","홈 퍼널 — LGU+ · KT 복주머니 → 운세"],["hm4","KT 투데이 홈 개편안 — 13개 영역"],["hm7c","홈 KPI 7개와 오픈 일정"],["fc2c","관상 퍼널 — 홈 → 결과 → 공유"],["fc4","관상 결과 — 조선 인물 관상 카드"],["fc6","조선 관상 도감 — 친구로 채우기"]]},

{id:"owol",chip:"오월",
 meta:"콰라소프트 · 해외주식 투자 앱 '오월' · 2018.12 – 2023.11 · PM (오월 2020.12 출시)",
 t:"홈 · 설정 개선으로 DAU +250%, 타깃을 4050 자산가로 바꾸자고 제안해 월 거래금액 +201%",
 res:"2030 적립식 투자자를 타깃으로 출시했지만 홈과 설정 화면에서 이탈이 높았습니다. 퍼널 분석과 페르소나 수익 계산으로 <b>'절세가 필요한 사람은 4050 자산가'</b>라는 결론을 내고, 화면 개선과 타깃 전환을 제안해(최종 결정은 대표) <b>DAU +250%, 기능 사용률 +157%, 가입 후 완료율 +167%, 월 거래금액 +201%</b>를 만들었습니다.",
 nums:[["+250%","DAU (홈 이탈 개선 후)"],["+157%","다이렉트 인덱싱 사용률"],["+201%","월 거래금액 (타깃 전환 후)"]],
 steps:[

var byId={}; P.forEach(function(p){byId[p.id]=p});
var chips=document.getElementById('chips'), view=document.getElementById('view');
P.forEach(function(p){
  var b=document.createElement('button'); b.type='button'; b.className='chip'+(p.alt?' alt':''); b.textContent=p.chip; b.dataset.id=p.id;
  b.addEventListener('click',function(){ show(p.id); window.scrollTo({top:0}); }); chips.appendChild(b);
});
var LAB=["문제 정의","가설 수립","설계 · 핵심 스펙","론칭 · 협업","임팩트 · 배운 것"];
function esc(s){return s.replace(/"/g,'&quot;')}
function show(id){
  var p=byId[id];
  [].forEach.call(chips.children,function(c){ c.setAttribute('aria-pressed',c.dataset.id===id); if(c.dataset.id===id) c.scrollIntoView({block:'nearest',inline:'nearest'}); });
  var h='<section class="head"><div class="meta">'+p.meta+'</div><h1>'+p.t+'</h1>';
  if(p.links) h+='<div class="links">'+p.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>'}).join('')+'</div>';
  h+='<div class="result"><small>'+(p.table?'요약':'한 줄 성과')+'</small>'+p.res+'</div>';
  if(p.nums) h+='<div class="nums">'+p.nums.map(function(n){return '<div><b>'+n[0]+'</b><span>'+n[1]+'</span></div>'}).join('')+'</div>';
  h+='</section>';
  h+='<div class="steps">'+p.steps.map(function(s,i){ return '<div class="step"><div class="no">'+(i+1)+'</div><div class="card"><div class="lab">'+LAB[i]+'</div><h2>'+s.h+'</h2><ul>'+s.li.map(function(l){return '<li>'+l+'</li>'}).join('')+'</ul>'+(s.judge?'<table class="t jd"><tbody><tr>'+s.judge.map(function(j){return '<td><small>'+j[0]+'</small>'+j[1]+'</td>'}).join('')+'</tr></tbody></table>':'')+'<div class="role"><b>내 역할</b> · '+s.r+'</div></div></div>'; }).join('')+'</div>';
  h+='<section class="gal"><h3>산출물 원본 · 눌러서 크게 보기</h3><div class="g">'+p.gal.map(function(g,i){return '<button type="button" data-i="'+i+'"><div class="im"><img src="w/'+g[0]+'.jpg" alt="'+esc(g[1])+'"></div><p>'+g[1]+'</p></button>'}).join('')+'</div></section>';
  view.innerHTML=h;
  view.querySelectorAll('.gal button').forEach(function(b){ b.addEventListener('click',function(){ openLb(p.gal,+b.dataset.i); }); });
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
var lb=document.getElementById('lb'), lbi=document.getElementById('lb-img'), lbs=document.getElementById('lb-st'), L={g:[],i:0}, lastF=null;
function openLb(g,i){ L.g=g; lastF=document.activeElement; lb.hidden=false; document.body.classList.add('lock'); lbs.classList.remove('actual'); document.getElementById('lb-fit').textContent='원본 크기'; lbShow(i); document.getElementById('lb-x').focus(); }
function lbShow(i){ L.i=(i+L.g.length)%L.g.length; var g=L.g[L.i]; lbi.src='w/'+g[0]+'.jpg'; lbi.alt=g[1]; document.getElementById('lb-cap').textContent=g[1]; document.getElementById('lb-c').textContent=(L.i+1)+' / '+L.g.length; lbs.scrollTop=0; lbs.scrollLeft=0; }
function closeLb(){ lb.hidden=true; document.body.classList.remove('lock'); lbi.src=''; if(lastF) lastF.focus(); }
document.getElementById('lb-x').addEventListener('click',closeLb);
document.getElementById('lb-p').addEventListener('click',function(){lbShow(L.i-1)});
document.getElementById('lb-n').addEventListener('click',function(){lbShow(L.i+1)});
document.getElementById('lb-fit').addEventListener('click',function(){ var a=lbs.classList.toggle('actual'); this.textContent=a?'화면에 맞추기':'원본 크기'; });
lbs.addEventListener('click',function(e){ if(e.target===lbs) closeLb(); });
document.addEventListener('keydown',function(e){ if(lb.hidden) return; if(e.key==='Escape') closeLb(); else if(e.key==='ArrowRight') lbShow(L.i+1); else if(e.key==='ArrowLeft') lbShow(L.i-1); });
var sx=null; lbs.addEventListener('touchstart',function(e){ if(!lbs.classList.contains('actual')) sx=e.touches[0].clientX; },{passive:true});
lbs.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) lbShow(L.i+(dx<0?1:-1)); sx=null; });
var h0=(location.hash||'').slice(1); show(byId[h0]?h0:'today');
})();
</script>
